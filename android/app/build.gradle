plugins {
    id 'com.android.application'
}

android {
    namespace 'br.francisco.trexlink'
    compileSdk 35

    defaultConfig {
        applicationId 'br.francisco.trexlink'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        fixo {
            storeFile file('trexlink.jks')
            storePassword 'trexlink123'
            keyAlias 'trexlink'
            keyPassword 'trexlink123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixo
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixo
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
